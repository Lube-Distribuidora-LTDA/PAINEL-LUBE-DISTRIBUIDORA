<body class="carregando editor-pg">

<div class="tarja-demo" data-tarja-demo hidden>DEMONSTRAÇÃO · dados sintéticos, nada aqui é real</div>

<div class="carga" aria-hidden="true">
  <div class="carga__caixa">
    <span class="carga__marca" data-marca-branca></span>
    <div class="carga__barra"><i></i></div>
    <span class="mono" data-carga-txt>Abrindo o arquivo</span>
  </div>
</div>

<div class="bloqueio" data-bloqueio hidden>
  <div class="bloqueio__caixa">
    <span class="carga__marca" data-marca-branca style="animation:none"></span>
    <h1 data-bloqueio-titulo>Entre pelo painel</h1>
    <p data-bloqueio-texto></p>
    <a class="btn btn--prim" href="./" data-bloqueio-botao>Voltar ao LUBE OFFICE</a>
  </div>
</div>

<header class="ed-topo">
  <a class="ed-voltar" href="./" data-voltar aria-label="Voltar ao LUBE OFFICE">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    <span class="ed-l" data-marca-branca></span>
  </a>
  <span class="ed-ico" data-ed-ico></span>
  <div class="ed-titulo">
    <strong data-ed-nome>…</strong>
    <span class="mono" data-ed-sub></span>
  </div>
  <div class="ed-acoes">
    <span class="selo-papel" data-ed-papel hidden></span>
    <a class="btn" href="#" data-ed-enviar hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4Z"/></svg>
      <span>Enviar</span>
    </a>
    <a class="btn" href="#" data-ed-compartilhar>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M19 8v6M16 11h6"/></svg>
      <span>Compartilhar</span>
    </a>
  </div>
</header>

<main class="ed-area">
  <div id="editor-onlyoffice" class="ed-motor" data-ed-motor hidden></div>

  <section class="ed-espera" data-ed-espera hidden>
    <div class="ed-cartao">
      <span class="ed-cartao__ico" data-ed-cartao-ico></span>
      <div class="ed-cartao__txt">
        <span class="mono" data-ed-estado>LUBE OFFICE</span>
        <h1 data-ed-cartao-nome></h1>
        <p data-ed-motivo></p>
      </div>
      <dl class="detalhes" data-ed-detalhes></dl>
      <div class="ed-cartao__acoes">
        <button class="btn btn--prim" type="button" data-ed-tentar>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
          Tentar de novo
        </button>
        <a class="btn" href="./" data-voltar>Voltar ao LUBE OFFICE</a>
      </div>
      <p class="ed-nota">O arquivo abre aqui mesmo, dentro do painel, para editar junto, com o nome e o cursor de cada pessoa. Nada é baixado.</p>
    </div>
  </section>
</main>

<div class="toasts" data-toasts aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
